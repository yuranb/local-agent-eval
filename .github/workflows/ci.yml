name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -q

  eval-gate:
    name: eval regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # CI has no Ollama, so the gate replays recorded model responses
      # (currently fixtures; see DECISIONS.md D3). Tools still run for real.
      - name: Run eval on recordings
        run: python -m evals.run_eval --backend recording --out evals/results.json
      - name: Gate against baseline
        run: python -m evals.gate --results evals/results.json --baseline evals/baseline.json
